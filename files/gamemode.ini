; ~/.config/gamemode.ini — drop CPU power limits while a game runs so the GPU
; keeps the shared power budget. Launch games with: gamemoderun %command%
[general]
; Leave the governor alone: intel_pstate EPP is already "performance" on AC, and the
; "performance" governor would raise CPU power and take budget from the GPU.
desiredgov=powersave
defaultgov=powersave

[custom]
start=sudo -n /usr/local/sbin/cpu-power-tune game-start
end=sudo -n /usr/local/sbin/cpu-power-tune game-end
script_timeout=10
